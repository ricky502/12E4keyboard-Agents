<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentpad 控制台</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#1a202b;--line:#30394a;--text:#eef3fb;--muted:#9aa8bd;--accent:#4b90ff;--ok:#29c57c;--warn:#ffbf4b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#11151c,#151d2a);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:34px 22px 70px}h1{font-size:28px;margin:0 0 7px}h2{font-size:17px;margin:0 0 14px}.sub,.hint{color:var(--muted);line-height:1.55}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:26px}.badge{border:1px solid var(--line);background:#182131;padding:8px 11px;border-radius:99px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(340px,1.08fr) minmax(300px,.92fr);gap:18px}.card{background:rgba(26,32,43,.92);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 12px 32px #0002}.keyboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{min-height:92px;border:1px solid #3d4a61;border-radius:12px;background:#20293a;padding:10px;position:relative}.key .slot{color:#8d9cb4;font-size:12px}.key input,.key select{width:100%;border:0;border-bottom:1px solid #46546b;background:transparent;color:var(--text);padding:6px 1px;outline:none}.key input:focus,.key select:focus{border-color:var(--accent)}.key.agent:before{content:"";width:9px;height:9px;border-radius:9px;background:#ccc;position:absolute;right:10px;top:10px;box-shadow:0 0 12px #fff}.key.function{background:#202533}.key.function select{margin-top:9px}.state-row{display:grid;grid-template-columns:1fr 58px 112px;gap:8px;align-items:center;margin:9px 0}.state-row input{width:54px;height:31px;border:0;background:transparent}.state-row select,.btn{border:1px solid #42506a;background:#202a3a;color:var(--text);border-radius:8px;padding:8px}.rotary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dial{border:1px solid #3d4a61;border-radius:12px;padding:14px;min-height:96px;background:#1c2533}.dial b{display:block;margin-bottom:6px}.dial span{font-size:13px;color:var(--muted);line-height:1.4}.actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:600}.btn:hover{filter:brightness(1.12);cursor:pointer}#message{min-height:20px;color:var(--muted)}#message.ok{color:var(--ok)}#message.error{color:#ff7676}.doctor{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.doctor ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{display:block}.badge{display:inline-block;margin-top:12px}.key{min-height:84px}.wrap{padding:24px 14px}}
</style>
</head>
<body><main class="wrap">
  <header class="top"><div><h1>Agentpad 控制台</h1><div class="sub">编辑本机 12E4 的 Agent 映射和状态灯。保存后立即由本地客户端生效，不刷机。</div></div><div id="online" class="badge">正在读取状态…</div></header>
  <div class="grid">
    <section class="card"><h2>12 个实体按键</h2><div class="hint">前两排为 Agent；第三排为固定功能动作。完成状态按键按下后会恢复白色。</div><div id="keys" class="keyboard" style="margin-top:16px"></div></section>
    <section class="card"><h2>状态灯颜色</h2><div id="states"></div><div class="doctor"><h2>4 个旋钮（当前固件映射）</h2><div class="rotary"><div class="dial"><b>1 · 屏幕亮度</b><span>按压：开 / 关小键盘灯</span></div><div class="dial"><b>2 · 快退 / 快进</b><span>按压：电脑睡眠</span></div><div class="dial"><b>3 · 系统音量</b><span>按压：播放 / 暂停</span></div><div class="dial"><b>4 · 文字缩放</b><span>无按压动作</span></div></div></div></section>
  </div>
  <section class="card doctor"><h2>本机诊断</h2><div id="doctor" class="hint">正在检查…</div><div class="actions"><span id="message"></span><button id="refresh" class="btn">刷新</button><button id="save" class="btn primary">保存本机配置</button></div></section>
</main>
<script>
const agentNames=['tanchun','daiyu','xiangyun','xiangling','yinger','codex','claude-vscode','baochai'];
const stateLabels={idle:'待机 / 白',thinking:'工作 / 蓝',complete:'完成 / 绿',needs_input:'等待输入 / 琥珀',error:'异常 / 红',off:'熄灭'};
const modeLabels=['常亮','闪烁','呼吸']; const actionLabels={talk:'Option（语音修饰键）',approve:'Enter（同意）',reject:' /stop + Enter',new_task:' /new + Enter'};
let profile;
function el(tag,attrs={},text=''){const e=document.createElement(tag);Object.assign(e,attrs);if(text)e.textContent=text;return e}
function render(){const keys=document.querySelector('#keys');keys.innerHTML='';profile.agent_slots.forEach((name,i)=>{const box=el('div',{className:'key agent'});box.append(el('div',{className:'slot'},`第 ${i+1} 个 Agent 键`));const input=el('input',{value:name,ariaLabel:`Agent 槽位 ${i+1}`});input.dataset.agent=i;box.append(input);keys.append(box)});profile.function_actions.forEach((action,i)=>{const box=el('div',{className:'key function'});box.append(el('div',{className:'slot'},`底部功能键 ${i+1}`));const select=el('select');Object.entries(actionLabels).forEach(([id,label])=>select.append(el('option',{value:id,selected:id===action},label)));select.dataset.action=i;box.append(select);keys.append(box)});
const states=document.querySelector('#states');states.innerHTML='';Object.entries(profile.state_colors).forEach(([state,value])=>{const row=el('div',{className:'state-row'});row.append(el('label',{},stateLabels[state]||state));const color=el('input',{type:'color',value:'#'+value.rgb.map(x=>x.toString(16).padStart(2,'0')).join('')});color.dataset.color=state;row.append(color);const mode=el('select');modeLabels.forEach((label,index)=>mode.append(el('option',{value:index,selected:index===value.mode},label)));mode.dataset.mode=state;row.append(mode);states.append(row)})}
function collect(){const p=JSON.parse(JSON.stringify(profile));document.querySelectorAll('[data-agent]').forEach(e=>p.agent_slots[+e.dataset.agent]=e.value.trim());document.querySelectorAll('[data-action]').forEach(e=>p.function_actions[+e.dataset.action]=e.value);document.querySelectorAll('[data-color]').forEach(e=>p.state_colors[e.dataset.color].rgb=[e.value.slice(1,3),e.value.slice(3,5),e.value.slice(5,7)].map(x=>parseInt(x,16)));document.querySelectorAll('[data-mode]').forEach(e=>p.state_colors[e.dataset.mode].mode=+e.value);return p}
function note(text,type=''){const n=document.querySelector('#message');n.textContent=text;n.className=type}
async function refresh(){try{const [p,d]=await Promise.all([fetch('/profile').then(r=>r.json()),fetch('/doctor').then(r=>r.json())]);profile=p.profile;render();document.querySelector('#online').textContent=d.keyboard.online?'键盘已连接':'键盘暂未连接';const steps=d.next_steps?.length?d.next_steps.join('；'):'所有本地检查已完成';document.querySelector('#doctor').innerHTML=`<b>${d.ok?'检查通过':'需要注意'}</b><ul><li>键盘：${d.keyboard.online?'已连接':'未连接'}</li><li>命令服务：${d.command_adapter.ok?'正常':'未就绪'}</li><li>飞书监听：${d.feishu_status_listener.enabled?'已启用':'未启用'}</li><li>${steps}</li></ul>`}catch(e){note('无法连接本机 Agentpad 服务：'+e.message,'error')}}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#save').onclick=async()=>{const panel_profile=collect();if(panel_profile.agent_slots.some(x=>!x)){note('Agent 名称不能为空','error');return}note('正在保存…');try{const r=await fetch('/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({panel_profile})});const data=await r.json();if(!data.ok)throw new Error((data.warnings||['保存失败']).join('；'));profile=data.profile;render();note('已保存并应用到本机客户端','ok')}catch(e){note(e.message,'error')}};refresh();
</script></body></html>
